[project]
name = "genviewer"
version = "0.1.0"
description = "Editor for the genMOLDB device database (Cadence Virtuoso SKILL suite)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 6.9.3 은 manylinux_2_28 휠이 있는 마지막 릴리스다 (6.10 부터 2_34).
    # RHEL 8 은 glibc 2.28 이므로 여기가 상한이고, 이 휠이 Python 3.14 를
    # 지원하지 않아 인터프리터도 3.13 으로 고정된다.
    "PySide6==6.9.3",
    "pandas>=3.0,<4",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.3,<4",
]

[project.scripts]
genviewer = "genviewer.main:main"
genviewer-init-db = "genviewer.scripts.init_db:main"
genviewer-import-sqlite = "genviewer.scripts.import_sqlite:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src 레이아웃이라 빌드 대상을 명시한다.
# config/*.json 은 패키지 안에 있으므로 함께 들어간다.
packages = ["src/genviewer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: rowCount(self, parent=QModelIndex()) 는 PySide6 모델의 표준 시그니처다.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
