[project]
name = "genviewer"
version = "0.1.0"
description = "Editor for the genMOLDB device database (Cadence Virtuoso SKILL suite)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 6.9.3 은 manylinux_2_28 휠이 있는 마지막 릴리스다 (6.10 부터 2_34).
    # RHEL 8 은 glibc 2.28 이므로 여기가 상한이고, 이 휠이 Python 3.14 를
    # 지원하지 않아 인터프리터도 3.13 으로 고정된다.
    "PySide6==6.9.3",
    "pandas>=3.0,<4",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.3,<4",
    # 도움말과 에러는 rich 없이 평문으로 낸다 (cli.py 의 rich_markup_mode=None).
    # 한국어 Windows 콘솔은 cp949 라 rich 가 그리는 상자 문자를 못 찍는다.
    # typer-slim 을 쓰지 않는 이유: 그 이름은 이제 typer 를 끌어오는 껍데기다.
    "typer>=0.15",
]

[project.scripts]
genviewer = "genviewer.cli:main"
genviewer-init-db = "genviewer.scripts.init_db:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.5.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src 레이아웃이라 빌드 대상을 명시한다.
# config/*.json 은 패키지 안에 있으므로 함께 들어간다.
packages = ["src/genviewer"]

[tool.ruff]
line-length = 100
target-version = "py313"
# scripts/ 는 하네스(execute.py, pexqa 와 같은 사본), phases/ 는 step 문서다.
# 앱 코드가 아니라서 이 규칙을 맞추지 않는다.
extend-exclude = ["scripts", "phases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: rowCount(self, parent=QModelIndex()) 는 PySide6 모델의 표준 시그니처다.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]   # GUI 테스트 헬퍼를 `from gui_support.dialogs import ...` 로 쓴다
qt_api = "pyside6"
